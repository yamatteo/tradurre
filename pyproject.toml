[project]
name = "tradurre"
version = "0.1.0"
description = "Literary translation workbench"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-docx>=1.1.0",
    "pydantic>=2.10.0",
    "python-multipart>=0.0.22",
    "pymupdf>=1.24",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
]

[project.optional-dependencies]
# Redundant since pymupdf is a core dependency; kept because the Windows launcher installs `tradurre[pdf]`.
pdf = [
    "pymupdf>=1.24",
]
ocr = [
    "pytesseract>=0.3.10",
    "pillow>=10.0",
]
align = ["sentence-transformers>=3.0", "transformers>=4.44", "torch>=2.3", "accelerate>=0.33", "bitsandbytes>=0.43", "bertalign>=2.0.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# The built frontend is gitignored but must ship in the wheel.
artifacts = ["tradurre/static/"]

[project.scripts]
tradurre = "tradurre.__main__:main"
tradurre-align = "tradurre.services.pipeline_cli:main"

[tool.pytest.ini_options]
markers = [
    "library: tests on the local reference book (library/contrefeu.*.pdf); skipped when it is missing",
]
