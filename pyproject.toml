[project]
name = "tradurre"
version = "0.1.0"
description = "Literary translation workbench"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-docx>=1.1.0",
    "pydantic>=2.10.0",
    "python-multipart>=0.0.22",
    "httpx>=0.28.1",
    "pytest>=9.0.2",
]

[project.scripts]
tradurre = "tradurre.__main__:main"
