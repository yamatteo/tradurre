[project]
name = "tradurre"
version = "0.1.0"
description = "Literary translation workbench"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-docx>=1.1.0",
    "pydantic>=2.10.0",
    "python-multipart>=0.0.22",
    "httpx>=0.28.1",
    "pytest>=9.0.2",
]

[project.optional-dependencies]
pdf = ["pymupdf>=1.24"]
align = ["sentence-transformers>=3.0", "transformers>=4.44", "torch>=2.3", "accelerate>=0.33"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
tradurre = "tradurre.__main__:main"
