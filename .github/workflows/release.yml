name: Release

# Push a tag like v0.2.0 to build the frontend into the package, build the
# wheel, and attach it (plus the self-installing Windows launcher) to a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend into tradurre/static
        working-directory: frontend
        run: |
          npm ci
          npm run build-only  # TODO: switch to `npm run build` once vue-tsc passes again

      - uses: astral-sh/setup-uv@v6

      - name: Check tag matches package version
        run: |
          version=$(uv version --short)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject version $version" >&2
            exit 1
          fi

      - name: Build wheel
        run: |
          uv build --wheel
          unzip -l dist/*.whl | grep -q 'tradurre/static/index.html' || { echo "frontend missing from wheel" >&2; exit 1; }

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          wheel=$(ls dist/*.whl)
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/$(basename "$wheel")"
          cat > notes.md <<NOTES
          **Windows:** download \`start-tradurre.bat\` below and double-click it. It installs or upgrades
          Tradurre to this version if needed, then starts it.

          Install or upgrade from a terminal:

          \`\`\`
          uv tool install --force "$url"
          \`\`\`

          With PDF import support:

          \`\`\`
          uv tool install --force "tradurre[pdf] @ $url"
          \`\`\`
          NOTES
          # Bake this release's version and wheel URL into the self-installing Windows launcher.
          sed -e "s|__WHEEL_URL__|$url|" -e "s|__VERSION__|${GITHUB_REF_NAME#v}|" \
            packaging/start-tradurre.bat > dist/start-tradurre.bat
          if grep -q "__WHEEL_URL__\|__VERSION__" dist/start-tradurre.bat; then
            echo "placeholders not substituted into launcher" >&2; exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "$wheel" dist/start-tradurre.bat \
            --title "$GITHUB_REF_NAME" --notes-file notes.md
